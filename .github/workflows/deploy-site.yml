# Deploys the website: asks the server (via SSM) to run ansible-pull on the pushed commit.
#
# Required GitHub secrets (Settings -> Environments -> production):
#   AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY - the same CI IAM user as terraform.yml

name: 'Deploy site'

on:
  push:
    branches: [ "main" ]
    paths: [ "site/**", "ansible/**", ".github/workflows/deploy-site.yml" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-site
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  REPO_URL: https://github.com/${{ github.repository }}.git

jobs:
  deploy:
    name: 'Deploy'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash

    steps:
    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Find the server
      run: |
        INSTANCE_ID=$(aws ec2 describe-instances \
          --filters "Name=tag:Name,Values=cv-server" "Name=instance-state-name,Values=running" \
          --query "Reservations[0].Instances[0].InstanceId" --output text)
        if [ "$INSTANCE_ID" = "None" ] || [ -z "$INSTANCE_ID" ]; then
          echo "No running instance tagged cv-server"; exit 1
        fi
        echo "INSTANCE_ID=$INSTANCE_ID" >> "$GITHUB_ENV"

    - name: Run ansible-pull on the server
      run: |
        SCRIPT="set -e
        command -v ansible-pull >/dev/null || { apt-get update && apt-get install -y ansible-core git; }
        ansible-pull -U $REPO_URL -C $GITHUB_SHA -d /opt/cv ansible/site.yml"

        PARAMS=$(jq -n --arg s "$SCRIPT" '{commands: [$s]}')

        COMMAND_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name AWS-RunShellScript \
          --comment "deploy $GITHUB_SHA" \
          --parameters "$PARAMS" \
          --query "Command.CommandId" --output text)
        echo "SSM command: $COMMAND_ID"

        # Wait up to 10 minutes: the first run installs Ansible and Caddy
        for i in $(seq 1 60); do
          sleep 10
          STATUS=$(aws ssm get-command-invocation --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
          echo "Status: $STATUS"
          case "$STATUS" in
            Pending|InProgress|Delayed) continue ;;
            *) break ;;
          esac
        done

        aws ssm get-command-invocation --command-id "$COMMAND_ID" --instance-id "$INSTANCE_ID" \
          --query "[StandardOutputContent, StandardErrorContent]" --output text

        [ "$STATUS" = "Success" ]

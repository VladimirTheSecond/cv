# Runs Terraform directly on the GitHub runner against AWS.
# On pull requests: init, fmt check, validate, plan.
# On push to "main": the same, followed by apply.
#
# Required GitHub secrets (Settings -> Environments -> production -> Environment secrets):
#   AWS_ACCESS_KEY_ID      - access key of the dedicated CI IAM user
#   AWS_SECRET_ACCESS_KEY  - secret key of the dedicated CI IAM user
#   TF_STATE_BUCKET        - name of the existing S3 bucket that stores Terraform state
#
# Optional GitHub variable (Settings -> Secrets and variables -> Actions -> Variables):
#   AWS_REGION             - defaults to eu-central-1

name: 'Terraform'

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_VAR_aws_region: ${{ vars.AWS_REGION || 'eu-central-1' }}
  TF_VAR_ssh_public_key: ${{ secrets.SSH_PUBLIC_KEY }}

jobs:
  terraform:
    name: 'Terraform'
    runs-on: ubuntu-latest
    environment: production

    defaults:
      run:
        shell: bash

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Configure AWS credentials
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ${{ env.AWS_REGION }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3

    - name: Terraform Init
      run: |
        terraform init -input=false \
          -backend-config="bucket=${{ secrets.TF_STATE_BUCKET }}" \
          -backend-config="region=${{ env.AWS_REGION }}"

    - name: Terraform Format
      run: terraform fmt -check

    - name: Terraform Validate
      run: terraform validate

    - name: Terraform Plan
      run: terraform plan -input=false -out=tfplan

    - name: Terraform Apply
      if: github.ref == 'refs/heads/main' && github.event_name == 'push'
      run: terraform apply -input=false tfplan

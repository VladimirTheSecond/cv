- name: Add Caddy apt repository
  ansible.builtin.deb822_repository:
    name: caddy-stable
    types: [deb]
    uris: https://dl.cloudsmith.io/public/caddy/stable/deb/debian
    suites: [any-version]
    components: [main]
    signed_by: https://dl.cloudsmith.io/public/caddy/stable/gpg.key

# allow_change_held_packages: the package is held (below), so a version bump must override the hold
- name: Install pinned Caddy version
  ansible.builtin.apt:
    name: "caddy={{ caddy_version }}"
    update_cache: true
    allow_downgrade: true
    allow_change_held_packages: true

# Keep a manual `apt upgrade` from moving Caddy away from the pinned version
- name: Hold Caddy package
  ansible.builtin.dpkg_selections:
    name: caddy
    selection: hold

- name: Create Caddy log directory
  ansible.builtin.file:
    path: /var/log/caddy
    state: directory
    owner: caddy
    group: caddy
    mode: "0755"

- name: Create Caddy access log
  ansible.builtin.file:
    path: /var/log/caddy/access.log
    state: touch
    owner: caddy
    group: caddy
    mode: "0640"
    access_time: preserve
    modification_time: preserve

- name: Deploy Caddyfile
  ansible.builtin.template:
    src: Caddyfile.j2
    dest: /etc/caddy/Caddyfile
    mode: "0644"
    validate: caddy validate --adapter caddyfile --config %s
  notify: Reload Caddy

- name: Ensure Caddy is running
  ansible.builtin.service:
    name: caddy
    state: started
    enabled: true

# t3.micro has 1 GB RAM: swap keeps apt and Ansible from running out of memory
- name: Create swap file
  ansible.builtin.command: fallocate -l 1G /swapfile
  args:
    creates: /swapfile

- name: Set swap file permissions
  ansible.builtin.file:
    path: /swapfile
    mode: "0600"

- name: Check active swap
  ansible.builtin.command: swapon --show=NAME --noheadings
  register: swap_active
  changed_when: false

- name: Format and enable swap file
  ansible.builtin.shell: mkswap /swapfile && swapon /swapfile
  when: "'/swapfile' not in swap_active.stdout"

- name: Mount swap on boot
  ansible.builtin.lineinfile:
    path: /etc/fstab
    line: "/swapfile none swap sw 0 0"
